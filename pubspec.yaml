name: smart_fireguard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core + Auth + Realtime DB
  
  firebase_auth: ^6.0.2
  firebase_database: ^12.0.1

  # FCM notifications
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.4.2
  flutter_background_service: ^5.0.7
  flutter_background_service_android: any

  # Useful utilities
  http: ^1.5.0
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.0.3 # Old API for the welcome_page
  webview_flutter: ^4.2.2
  google_maps_flutter: ^2.5.0
  intl: ^0.20.2
  url_launcher: any  # 🔧 You had this without a version, which is okay, but may cause pub warnings
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.0.1
  permission_handler: ^12.0.1
  firebase_crashlytics: ^5.0.1
  path_provider: ^2.1.4   # (or latest version)



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4 # Latest version
  build_runner: ^2.4.13 # Latest version
  fake_async: ^1.3.1
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/bg.jpg
    - assets/firealarm.mp3
    - assets/flamealarm.mp3
    - assets/smokealarm.mp3

  fonts:
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf
        - asset: fonts/RobotoMono-Bold.ttf
          weight: 700
    - family: PressStart2P
      fonts:
        - asset: fonts/PressStart2P-Regular.ttf
