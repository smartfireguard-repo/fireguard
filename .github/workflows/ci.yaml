name: CI - Flutter Unit Tests

on:
  push:
    branches: [main, USER-BASED-CI-TESTING]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate mocks
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test test/welcome_page_test.dart test/register_page_test.dart test/login_page_test.dart test/main_test.dart --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build debug APK  # Optional: Skip for faster CI if not needed
        run: flutter build apk --debug

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk

      - name: Bump version tag and push
        id: bump_tag
        # Optional: Restrict to main pushes only
        # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")  # Changed default to v1.0.0

          echo "Latest tag: $latest_tag"

          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"  # Safer parsing (handles missing parts)

          # Default to 0 if part is empty
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          new_tag="v${major}.${minor}.$((patch + 1))"

          echo "New tag: $new_tag"

          # Export as step output
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

          git tag "$new_tag"
          git push origin "$new_tag"

      - name: Show new version tag
        run: echo "Successfully tagged new version ${{ steps.bump_tag.outputs.new_tag }}"