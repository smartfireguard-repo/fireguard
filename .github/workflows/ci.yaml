name: CI - Flutter Unit Tests

on:
  push:
    branches: [main, USER-BASED-CI-TESTING] # Trigger on pushes to main or USER-BASED-CI-TESTING
  pull_request:
    branches: [main] # Trigger on PRs to main

jobs:
  test:
    runs-on: ubuntu-latest # Use Ubuntu runner

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5' # Matches your specified version
          channel: 'stable' # Stable channel
          cache: true # Enable caching for faster runs

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Generate mocks with build_runner
      - name: Generate mocks
        run: dart run build_runner build --delete-conflicting-outputs

      # Run unit tests
      - name: Run unit tests
        run: flutter test test/welcome_page_test.dart --coverage # Run specific test file with coverage

      # Upload coverage to Codecov (optional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info # Coverage file generated by flutter test
          token: ${{ secrets.CODECOV_TOKEN }} # Requires token in repo settings
          fail_ci_if_error: false # Prevent CI failure if Codecov upload fails