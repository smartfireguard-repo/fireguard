name: CI - Flutter Unit Tests

on:
  push:
    branches: [ main, FIXED-USERBASED-2.0 ] # Trigger on pushes to main or develop
  pull_request:
    branches: [ main ] # Trigger on PRs to main

jobs:
  test:
    runs-on: ubuntu-latest # Use Ubuntu runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.5' # Use your project's Flutter version (run `flutter --version` locally)
        channel: 'stable' # Or beta/stable as needed

    - name: Install dependencies
      run: flutter pub get

    - name: Run unit tests
      run: flutter test --coverage # Runs all tests in test/ and generates coverage

    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v4
      with:
        file: coverage/lcov.info # Coverage file generated by flutter test
        token: ${{ secrets.CODECOV_TOKEN }} # Add token in repo settings for Codecov